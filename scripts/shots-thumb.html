<!-- The theme browser's thumbnail, 1024x576 at 2x, scaled down to the 512x288
     Obsidian recommends: the card's scene in 16:9, so the theme browser and the
     community directory show the same image. scripts/shots.mjs fills {{light}},
     {{dark}}, {{phone}} and {{phoneLight}} as for the card. -->
<style>
	.cover {
		position: relative;
		width: 1024px;
		height: 576px;
		overflow: hidden;
		background: radial-gradient(120% 140% at 85% 30%, #f7f8fa 0%, #ebedf3 55%, #e1e4ec 100%);
		font-family: "Inter", sans-serif;
		-webkit-font-smoothing: antialiased;
	}
	.title { position: absolute; left: 56px; top: 56px; }
	h1 { margin: 0; color: #1f2328; font-size: 88px; font-weight: 600; letter-spacing: -0.035em; line-height: 1; }
	.tagline { margin-top: 14px; color: #3b434c; font-size: 24px; letter-spacing: -0.01em; }
	.window {
		position: absolute;
		width: 440px;
		overflow: hidden;
		border-radius: 9px;
		box-shadow: 0 0 0 1px rgb(15 20 30 / 10%), 0 20px 50px -12px rgb(15 20 30 / 35%), 0 8px 18px -8px rgb(15 20 30 / 25%);
	}
	.window img { display: block; width: 100%; }
	.light { left: 528px; top: 56px; }
	.dark { left: 56px; top: 227px; }
	.phone {
		position: absolute;
		width: 135px;
		height: 240px;
		padding: 5px;
		border-radius: 24px;
		background: #0b0c0f;
		box-shadow: inset 0 0 0 1px rgb(255 255 255 / 8%), 0 0 0 1px rgb(15 20 30 / 25%), 0 24px 50px -14px rgb(15 20 30 / 50%);
	}
	.phone img { display: block; width: 135px; height: 240px; border-radius: 20px; }
	.phone.on-dark { left: 662px; top: 270px; }
	.phone.on-light { left: 823px; top: 270px; }
</style>
<div class="cover">
	<div class="title">
		<h1>Tela</h1>
		<div class="tagline">Easy to read. Easy to scan.</div>
	</div>
	<div class="window light"><img src="{{light}}" alt=""></div>
	<div class="window dark"><img src="{{dark}}" alt=""></div>
	<div class="phone on-dark"><img src="{{phone}}" alt=""></div>
	<div class="phone on-light"><img src="{{phoneLight}}" alt=""></div>
</div>
