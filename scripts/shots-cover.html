<!-- The README cover and GitHub social preview, 1280x640 at 2x: the card's
     scene (scripts/shots-card.html) at 0.72 scale beside the title.
     scripts/shots.mjs fills {{light}}, {{dark}}, {{phone}} and {{phoneLight}}
     with its captures and renders this in a shadow root over Obsidian, so the
     type is the Inter that Obsidian bundles. -->
<style>
	.cover {
		position: relative;
		width: 1280px;
		height: 640px;
		overflow: hidden;
		background: radial-gradient(120% 140% at 85% 30%, #f7f8fa 0%, #ebedf3 55%, #e1e4ec 100%);
		font-family: "Inter", sans-serif;
		-webkit-font-smoothing: antialiased;
	}
	.title { position: absolute; left: 64px; top: 50%; transform: translateY(-50%); }
	h1 { margin: 0; color: #1f2328; font-size: 112px; font-weight: 600; letter-spacing: -0.035em; line-height: 1; }
	.tagline { margin-top: 20px; color: #3b434c; font-size: 30px; letter-spacing: -0.01em; }
	.window {
		position: absolute;
		width: 432px;
		overflow: hidden;
		border-radius: 8px;
		box-shadow: 0 0 0 1px rgb(15 20 30 / 10%), 0 18px 45px -9px rgb(15 20 30 / 35%), 0 6px 14px -6px rgb(15 20 30 / 25%);
	}
	.window img { display: block; width: 100%; }
	.light { left: 784px; top: 84px; }
	.dark { left: 456px; top: 268px; }
	.phone {
		position: absolute;
		width: 130px;
		height: 231px;
		padding: 5px;
		border-radius: 24px;
		background: #0b0c0f;
		box-shadow: inset 0 0 0 1px rgb(255 255 255 / 8%), 0 0 0 1px rgb(15 20 30 / 25%), 0 22px 45px -10px rgb(15 20 30 / 50%);
	}
	.phone img { display: block; width: 130px; height: 231px; border-radius: 19px; }
	.phone.on-dark { left: 921px; top: 316px; }
	.phone.on-light { left: 1077px; top: 316px; }
</style>
<div class="cover">
	<div class="title">
		<h1>Tela</h1>
		<div class="tagline">Easy to read. Easy to scan.</div>
	</div>
	<div class="window light"><img src="{{light}}" alt=""></div>
	<div class="window dark"><img src="{{dark}}" alt=""></div>
	<div class="phone on-dark"><img src="{{phone}}" alt=""></div>
	<div class="phone on-light"><img src="{{phoneLight}}" alt=""></div>
</div>
